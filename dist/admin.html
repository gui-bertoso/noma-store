<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Admin dashboard — Noma</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="pages.css">
  </head>
  <body>
    <div data-header></div>
    <main class="wrap admin-page">
      <section class="page-head"><div class="crumb">Restricted area</div><h1 class="admin-title">Store dashboard</h1><p>Catalog, prices, promotions and orders in one place.</p></section>
      <section class="panel admin-login" id="loginBox">
        <h2>Administrator access</h2>
        <p>Use the token configured in Cloudflare. It is not stored in the code.</p>
        <form id="loginForm" class="admin-form"><div class="field"><label>Token</label><input id="tokenInput" type="password" autocomplete="current-password" required></div><button class="btn">Sign in</button></form>
        <p id="loginError" class="admin-error"></p>
      </section>
      <section id="dashboard" hidden>
        <div class="admin-tabs"><button class="filter on" data-tab="catalog">Catalog</button><button class="filter" data-tab="settings">Settings</button><button class="filter" data-tab="orders">Orders</button><button class="filter" id="logout">Exit</button></div>
        <div class="admin-panel-tab" data-panel="catalog">
          <section class="admin-layout">
            <aside class="panel"><h2 id="productFormTitle">New product</h2><form class="admin-form" id="productForm"><input type="hidden" name="id"><div class="field"><label>Name</label><input name="name" required></div><div class="field"><label>Category</label><input name="category" required></div><div class="field"><label>Price (R$)</label><input name="price" type="number" step=".01" min="0" required></div><div class="field"><label>Stock</label><input name="stock" type="number" min="0" value="0" required></div><div class="field full"><label>Image URL</label><input name="image" type="url"></div><div class="field full"><label>Description</label><textarea name="description" rows="3"></textarea></div><div class="field"><label>Badge</label><input name="tag" placeholder="New, featured..."></div><button class="btn">Save product</button><button type="button" class="btn secondary" id="clearProduct">Clear</button></form></aside>
            <div><h2>Current catalog <span id="productCount" class="muted"></span></h2><div class="admin-list" id="productList"></div></div>
          </section>
        </div>
        <div class="admin-panel-tab" data-panel="settings" hidden><section class="panel"><h2>Business settings</h2><form id="settingsForm" class="checkout-form"><div class="field"><label>Store name</label><input name="store_name"></div><div class="field"><label>Default margin (%)</label><input name="margin_percent" type="number" min="0" step=".1"></div><div class="field"><label>Shipping (R$)</label><input name="shipping" type="number" min="0" step=".01"></div><div class="field"><label>Free shipping above (R$)</label><input name="free_shipping" type="number" min="0" step=".01"></div><div class="field full"><label>Promotional message</label><input name="promo_text"></div><button class="btn">Save settings</button></form></section></div>
        <div class="admin-panel-tab" data-panel="orders" hidden><section class="panel"><h2>Recent orders</h2><div class="admin-list" id="orderList"></div></section></div>
      </section>
    </main>
    <div data-footer></div><div class="toast" id="toast" role="status"></div>
    <script src="store.js"></script>
    <script>
      const $ = (selector) => document.querySelector(selector), tokenKey = 'noma-admin-token';
      const escapeHtml = (value) => String(value ?? '').replace(/[&<>'"]/g, (char) => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
      const money = (cents) => NomaStore.money(Number(cents) / 100);
      let products = [], settings = {};
      async function request(path, options = {}) { const response = await fetch(path, { ...options, headers: {'content-type':'application/json', authorization:`Bearer ${sessionStorage.getItem(tokenKey)}`, ...(options.headers || {})} }); const data = await response.json().catch(() => ({})); if (!response.ok) throw new Error(data.error || 'Could not complete the operation.'); return data; }
      function toast(message) { $('#toast').textContent = message; $('#toast').classList.add('on'); setTimeout(() => $('#toast').classList.remove('on'), 2200); }
      async function load() { try { [products, settings] = await Promise.all([request('/api/products'), request('/api/admin/settings')]); renderProducts(); renderSettings(); await renderOrders(); $('#loginBox').hidden = true; $('#dashboard').hidden = false; } catch (error) { sessionStorage.removeItem(tokenKey); $('#loginError').textContent = error.message; } }
      function renderProducts() { $('#productCount').textContent = `(${products.length})`; $('#productList').innerHTML = products.map((p) => `<article class="admin-row"><img src="${escapeHtml(p.image)}" alt=""><div><h3>${escapeHtml(p.name)}</h3><small>${escapeHtml(p.category)} · ${money(p.price_cents)} · ${p.stock} in stock</small></div><div class="admin-actions"><button class="btn secondary" data-edit="${escapeHtml(p.id)}">Edit</button><button class="remove" data-delete="${escapeHtml(p.id)}">Archive</button></div></article>`).join('') || '<div class="empty">No active products.</div>'; }
      function renderSettings() { const form = $('#settingsForm'); form.store_name.value = settings.store_name || ''; form.margin_percent.value = settings.margin_percent || 0; form.shipping.value = (Number(settings.shipping_cents || 0) / 100).toFixed(2); form.free_shipping.value = (Number(settings.free_shipping_threshold_cents || 0) / 100).toFixed(2); form.promo_text.value = settings.promo_text || ''; }
      async function renderOrders() { const orders = await request('/api/admin/orders'); $('#orderList').innerHTML = orders.map((order) => `<article class="admin-row"><div><h3>#${escapeHtml(order.id.slice(0, 8))}</h3><small>${escapeHtml(order.email)} · ${new Date(order.created_at + 'Z').toLocaleString('en-US')}</small></div><strong>${money(order.total_cents)}</strong><span class="status">${escapeHtml(order.status)}</span></article>`).join('') || '<div class="empty">No orders yet.</div>'; }
      function fillProduct(product) { const form = $('#productForm'); for (const [key, value] of Object.entries({id:product.id,name:product.name,category:product.category,price:Number(product.price_cents)/100,stock:product.stock,image:product.image || '',description:product.description || '',tag:product.tag || ''})) form.elements[key].value = value; $('#productFormTitle').textContent = 'Edit product'; }
      $('#loginForm').onsubmit = async (event) => { event.preventDefault(); sessionStorage.setItem(tokenKey, $('#tokenInput').value.trim()); await load(); };
      $('#logout').onclick = () => { sessionStorage.removeItem(tokenKey); location.reload(); };
      document.querySelectorAll('[data-tab]').forEach((button) => button.onclick = () => { document.querySelectorAll('[data-tab]').forEach((item) => item.classList.toggle('on', item === button)); document.querySelectorAll('[data-panel]').forEach((panel) => panel.hidden = panel.dataset.panel !== button.dataset.tab); });
      $('#clearProduct').onclick = () => { $('#productForm').reset(); $('#productForm').elements.id.value = ''; $('#productFormTitle').textContent = 'New product'; };
      $('#productList').onclick = async (event) => { const edit = event.target.closest('[data-edit]'), remove = event.target.closest('[data-delete]'); if (edit) fillProduct(products.find((product) => String(product.id) === edit.dataset.edit)); if (remove && confirm('Archive this product?')) { await request(`/api/admin/products/${remove.dataset.delete}`, {method:'DELETE'}); products = products.filter((product) => String(product.id) !== remove.dataset.delete); renderProducts(); toast('Product archived'); } };
      $('#productForm').onsubmit = async (event) => { event.preventDefault(); const data = Object.fromEntries(new FormData(event.target)); const body = {...data, price_cents:Math.round(Number(data.price) * 100), stock:Number(data.stock)}; delete body.price; if (body.id) { await request(`/api/admin/products/${body.id}`, {method:'PATCH',body:JSON.stringify(body)}); toast('Product updated'); } else { await request('/api/admin/products', {method:'POST',body:JSON.stringify(body)}); toast('Product added'); } $('#clearProduct').click(); products = await request('/api/products'); renderProducts(); };
      $('#settingsForm').onsubmit = async (event) => { event.preventDefault(); const data = Object.fromEntries(new FormData(event.target)); await request('/api/admin/settings', {method:'PUT',body:JSON.stringify({store_name:data.store_name,margin_percent:data.margin_percent,shipping_cents:Math.round(Number(data.shipping) * 100),free_shipping_threshold_cents:Math.round(Number(data.free_shipping) * 100),promo_text:data.promo_text})}); toast('Settings saved'); };
      if (sessionStorage.getItem(tokenKey)) load();
    </script>
  </body>
</html>
