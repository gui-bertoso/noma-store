<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Shop — Noma</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="pages.css">
  </head>
  <body>
    <div data-header>
    </div>
    <main class="wrap">
      <section class="page-head">
        <div class="crumb">Home / Shop</div>
        <h1>All products</h1>
        <p>Honest, useful and beautiful pieces for spaces that feel good.</p>
      </section>
      <div class="filters" id="filters">
      </div>
      <section class="products" id="products">
      </section>
    </main>
    <div data-footer>
    </div>
    <div class="toast" id="toast">
    </div>
    <script src="store.js">
    </script>
    <script>
      let active='All';function render(){const list=active==='All'?NomaStore.products():NomaStore.products().filter(p=>p.category===active);products.innerHTML=list.map(p=>`<article class="card">
        <a href="product.html?id=${p.id}">
          <div class="media">
            <img src="${NomaStore.imageUrl(p.image)}" alt="${NomaStore.escapeHtml(p.name)}">${p.tag?`<span class="tag">${NomaStore.escapeHtml(p.tag)}</span>`:''}</div>
            <div class="card-info">
              <div class="category">${NomaStore.escapeHtml(p.category)}</div>
              <h3>${NomaStore.escapeHtml(p.name)}</h3>
              <span class="price">${NomaStore.money(p.price)}</span>
            </div>
          </a>
          <button class="quick" onclick="add(${p.id})" aria-label="Adicionar ${p.name}">+</button>
        </article>`).join('')||'<div class="empty">No products found.</div>'}function renderFilters(){const cats=['All',...new Set(NomaStore.products().map(p=>p.category))];filters.innerHTML=cats.map(c=>`<button class="filter ${c===active?'on':''}" data-category="${c}">${c}</button>`).join('');filters.querySelectorAll('button').forEach(b=>b.onclick=()=>{active=b.dataset.category;renderFilters();render()})}function add(id){NomaStore.add(id);toast.textContent='Product added to bag';toast.classList.add('on');setTimeout(()=>toast.classList.remove('on'),1800)}renderFilters();render();
      </script>
    </body>
  </html>
