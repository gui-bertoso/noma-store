<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Painel de produtos — Noma</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="pages.css">
  </head>
  <body>
    <div data-header>
    </div>
    <main class="wrap">
      <section class="page-head">
        <div class="crumb">Painel da loja</div>
        <h1 class="admin-title">Produtos</h1>
        <p>Cadastre novos itens e acompanhe o estoque da sua vitrine.</p>
      </section>
      <section class="admin-layout">
        <aside class="panel">
          <h2 style="margin-top:0">Novo produto</h2>
          <form class="admin-form" id="form">
            <div class="field">
              <label>Nome</label>
              <input name="name" required>
            </div>
            <div class="field">
              <label>Categoria</label>
              <input name="category" required>
            </div>
            <div class="field">
              <label>Preço (R$)</label>
              <input name="price" type="number" step=".01" min=".01" required>
            </div>
            <div class="field">
              <label>Estoque</label>
              <input name="stock" type="number" min="0" value="10" required>
            </div>
            <div class="field">
              <label>URL da imagem</label>
              <input name="image" type="url" required>
            </div>
            <div class="field">
              <label>Descrição</label>
              <textarea name="description" rows="3" required>
              </textarea>
            </div>
            <div class="field">
              <label>Selo</label>
              <input name="tag" placeholder="Novo, destaque...">
            </div>
            <button class="btn">Cadastrar produto</button>
          </form>
        </aside>
        <div>
          <h2 style="margin-top:0">Catálogo atual <span id="amount" style="color:var(--muted)">
            </span>
          </h2>
          <div class="admin-list" id="list">
          </div>
        </div>
      </section>
    </main>
    <div data-footer>
    </div>
    <div class="toast" id="toast">
    </div>
    <script src="store.js">
    </script>
    <script>
      function render(){const ps=NomaStore.products();amount.textContent=`(${ps.length})`;list.innerHTML=ps.map(p=>`<article class="admin-row">
        <img src="${p.image}" alt="">
        <div>
          <h3>${p.name}</h3>
          <small>${p.category} · ${NomaStore.money(p.price)} · ${p.stock} em estoque</small>
        </div>
        <button class="remove" onclick="removeProduct(${p.id})">Excluir</button>
      </article>`).join('')}function removeProduct(id){if(!confirm('Excluir este produto?'))return;NomaStore.setProducts(NomaStore.products().filter(p=>p.id!==id));NomaStore.setCart(NomaStore.cart().filter(i=>i.id!==id));render()}form.onsubmit=e=>{e.preventDefault();const f=new FormData(form),ps=NomaStore.products();ps.unshift({id:Date.now(),name:f.get('name'),category:f.get('category'),price:Number(f.get('price')),stock:Number(f.get('stock')),image:f.get('image'),description:f.get('description'),tag:f.get('tag')});NomaStore.setProducts(ps);form.reset();render();toast.textContent='Produto cadastrado com sucesso';toast.classList.add('on');setTimeout(()=>toast.classList.remove('on'),1800)};render();
    </script>
  </body>
</html>
