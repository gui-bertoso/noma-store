<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sua sacola — Noma</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="pages.css">
</head>
<body>
<div data-header>
</div>
<main class="wrap">
<section class="page-head">
<div class="crumb">Início / Sacola</div>
<h1>Sua sacola</h1>
</section>
<section class="cart-layout">
<div id="cartItems">
</div>
<aside class="order">
<h2>Resumo do pedido</h2>
<div class="line">
<span>Subtotal</span>
<b id="subtotal">
</b>
</div>
<div class="line">
<span>Entrega</span>
<b id="shipping">
</b>
</div>
<div class="line total">
<span>Total</span>
<span id="total">
</span>
</div>
<a class="btn" href="checkout.html">Ir para pagamento →</a>
<p style="color:var(--muted);font-size:12px;text-align:center">Ambiente demonstrativo. Nenhuma cobrança real.</p>
</aside>
</section>
</main>
<div data-footer>
</div>
<script src="store.js">
</script>
<script>
function render(){const list=NomaStore.enriched(),sub=NomaStore.subtotal(),ship=sub>=299?0:24.9;cartItems.innerHTML=list.length?list.map(i=>`<article class="cart-item">
<a href="produto.html?id=${i.id}">
<img src="${i.product.image}" alt="${i.product.name}">
</a>
<div>
<div class="category">${i.product.category}</div>
<h3>${i.product.name}</h3>
<b>${NomaStore.money(i.product.price)}</b>
<div class="qty-controls">
<button onclick="change(${i.id},-1)">−</button>
<span>${i.qty}</span>
<button onclick="change(${i.id},1)">+</button>
</div>
</div>
<button class="remove" onclick="change(${i.id},-${i.qty})">Remover</button>
</article>`).join(''):'<div class="empty">Sua sacola está vazia.<br>
<br>
<a class="btn" href="loja.html">Explorar produtos</a>
</div>';subtotal.textContent=NomaStore.money(sub);shipping.textContent=ship?NomaStore.money(ship):'Grátis';total.textContent=NomaStore.money(sub+ship);document.querySelector('.order .btn').style.pointerEvents=list.length?'auto':'none';document.querySelector('.order .btn').style.opacity=list.length?'1':'.45'}function change(id,n){NomaStore.change(id,n);render()}render();
</script>
</body>
</html>
