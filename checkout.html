<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Pagamento — Noma</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="pages.css">
  </head>
  <body>
    <div data-header>
    </div>
    <main class="checkout-box" id="box">
      <div class="crumb">
        <a href="carrinho.html">← Voltar para a sacola</a>
      </div>
      <h1>Entrega e pagamento</h1>
      <form class="checkout-form" id="form">
        <div class="field">
          <label>Nome completo</label>
          <input required autocomplete="name">
        </div>
        <div class="field">
          <label>E-mail</label>
          <input type="email" required autocomplete="email">
        </div>
        <div class="field full">
          <label>Endereço</label>
          <input required autocomplete="street-address">
        </div>
        <div class="field">
          <label>CEP</label>
          <input required placeholder="00000-000">
        </div>
        <div class="field">
          <label>Cidade</label>
          <input required>
        </div>
        <div class="field">
          <label>Estado</label>
          <select required>
            <option value="">Selecione</option>
            <option>SP</option>
            <option>RJ</option>
            <option>MG</option>
            <option>PR</option>
            <option>SC</option>
            <option>RS</option>
            <option>BA</option>
            <option>PE</option>
          </select>
        </div>
        <div class="field">
          <label>Forma de pagamento</label>
          <select id="payment">
            <option>Cartão de crédito</option>
            <option>PIX</option>
            <option>Boleto</option>
          </select>
        </div>
        <div class="field" id="cardField">
          <label>Cartão (demonstração)</label>
          <input inputmode="numeric" placeholder="4242 4242 4242 4242">
        </div>
        <div class="field full">
          <div class="order" style="position:static">
            <div class="line">
              <span>Produtos</span>
              <b id="sub">
              </b>
            </div>
            <div class="line">
              <span>Entrega</span>
              <b id="ship">
              </b>
            </div>
            <div class="line total">
              <span>Total</span>
              <span id="grand">
              </span>
            </div>
          </div>
        </div>
        <div class="field full">
          <button class="btn">Confirmar pedido seguro</button>
        </div>
      </form>
    </main>
    <div data-footer>
    </div>
    <script src="store.js">
    </script>
    <script>
      if(!NomaStore.cart().length)location.href='carrinho.html';const subtotal=NomaStore.subtotal(),frete=subtotal>=299?0:24.9;sub.textContent=NomaStore.money(subtotal);ship.textContent=frete?NomaStore.money(frete):'Grátis';grand.textContent=NomaStore.money(subtotal+frete);payment.onchange=()=>cardField.style.display=payment.value==='Cartão de crédito'?'flex':'none';form.onsubmit=e=>{e.preventDefault();const ps=NomaStore.products();NomaStore.cart().forEach(i=>{const p=ps.find(p=>p.id===i.id);if(p)p.stock=Math.max(0,p.stock-i.qty)});NomaStore.setProducts(ps);NomaStore.setCart([]);box.innerHTML=`<div class="success">
        <div class="success-mark">✓</div>
        <h1>Pedido confirmado!</h1>
        <p>Pedido <b>#${String(Date.now()).slice(-6)}</b> recebido.<br>Nenhum valor foi cobrado nesta demonstração.</p>
        <a class="btn" href="index.html">Voltar ao início</a>
      </div>`}
    </script>
  </body>
</html>
