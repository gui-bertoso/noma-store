<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Produto — Noma</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="pages.css"></head><body><div data-header></div><main class="wrap" id="detail"></main><div data-footer></div><div class="toast" id="toast"></div><script src="store.js"></script><script>
const id=Number(new URLSearchParams(location.search).get('id'))||1,p=NomaStore.products().find(x=>x.id===id);if(!p){detail.innerHTML='<div class="empty" style="margin:80px 0">Produto não encontrado. <a href="loja.html">Voltar à loja</a></div>'}else{document.title=p.name+' — Noma';detail.innerHTML=`<div class="product-detail"><div class="detail-image"><img src="${p.image}" alt="${p.name}"></div><div class="detail-copy"><div class="crumb"><a href="loja.html">Loja</a> / ${p.category}</div>${p.tag?`<span class="tag" style="position:static;align-self:flex-start;background:var(--lime)">${p.tag}</span>`:''}<h1>${p.name}</h1><div class="detail-price">${NomaStore.money(p.price)}</div><p>${p.description||'Uma peça Noma feita para acompanhar sua rotina por muitos anos.'}</p><div class="features"><div>✓ Materiais selecionados</div><div>✓ Envio rastreado para todo o Brasil</div><div>✓ Troca fácil em até 30 dias</div></div><div class="buy-row"><input class="qty-input" id="quantity" type="number" min="1" max="${p.stock}" value="1" aria-label="Quantidade"><button class="btn" onclick="buy()">Adicionar à sacola →</button></div><div class="notice">${p.stock} unidades disponíveis · compra segura</div></div></div>`}function buy(){NomaStore.add(id,Number(quantity.value));toast.textContent='Produto adicionado à sacola';toast.classList.add('on');setTimeout(()=>toast.classList.remove('on'),1800)}
</script></body></html>
