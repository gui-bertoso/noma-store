<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Your bag — Noma</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="pages.css">
  </head>
  <body>
    <div data-header></div>
    <main class="wrap">
      <section class="page-head">
        <div class="crumb"><a href="index.html">Home</a> / Bag</div>
        <h1>Your bag</h1>
      </section>
      <section class="cart-layout">
        <div id="cartItems" aria-live="polite"></div>
        <aside class="order">
          <h2>Order summary</h2>
          <div class="line"><span>Subtotal</span><b id="subtotalValue">R$ 0,00</b></div>
          <div class="line"><span>Delivery</span><b id="shippingValue">—</b></div>
          <div class="line total"><span>Total</span><span id="totalValue">R$ 0,00</span></div>
          <a class="btn" id="checkoutLink" href="checkout.html">Continue to payment →</a>
          <p style="color:var(--muted);font-size:12px;text-align:center">Free shipping on orders over R$ 299.</p>
        </aside>
      </section>
    </main>
    <div data-footer></div>
    <div class="toast" id="toast" role="status"></div>
    <script src="store.js"></script>
    <script>
      const cartItemsElement = document.getElementById('cartItems');
      const subtotalElement = document.getElementById('subtotalValue');
      const shippingElement = document.getElementById('shippingValue');
      const totalElement = document.getElementById('totalValue');
      const checkoutLink = document.getElementById('checkoutLink');

      function renderCart() {
        const items = NomaStore.enriched();
        const subtotal = NomaStore.subtotal();
        const shipping = items.length && subtotal < 299 ? 24.9 : 0;
        cartItemsElement.innerHTML = items.length ? items.map(({id, qty, product}) => `
          <article class="cart-item">
            <a href="product.html?id=${id}"><img src="${NomaStore.imageUrl(product.image)}" alt="${NomaStore.escapeHtml(product.name)}"></a>
            <div>
              <div class="category">${NomaStore.escapeHtml(product.category)}</div>
              <h3>${NomaStore.escapeHtml(product.name)}</h3>
              <b>${NomaStore.money(product.price)}</b>
              <div class="qty-controls" aria-label="Quantidade de ${product.name}">
                <button type="button" data-action="decrease" data-id="${id}" aria-label="Diminuir quantidade">−</button>
                <span>${qty}</span>
                <button type="button" data-action="increase" data-id="${id}" aria-label="Aumentar quantidade">+</button>
              </div>
            </div>
            <button class="remove" type="button" data-action="remove" data-id="${id}">Remove</button>
          </article>`).join('') : `
          <div class="empty">
            <h2>Your bag is empty</h2>
            <p>Choose a piece to start furnishing your home.</p>
            <a class="btn" href="shop.html">Explore products</a>
          </div>`;
        subtotalElement.textContent = NomaStore.money(subtotal);
        shippingElement.textContent = items.length ? (shipping ? NomaStore.money(shipping) : 'Free') : '—';
        totalElement.textContent = NomaStore.money(subtotal + shipping);
        checkoutLink.style.pointerEvents = items.length ? 'auto' : 'none';
        checkoutLink.style.opacity = items.length ? '1' : '.45';
      }

      cartItemsElement.addEventListener('click', (event) => {
        const button = event.target.closest('button[data-action]');
        if (!button) return;
        const id = Number(button.dataset.id);
        if (button.dataset.action === 'increase') NomaStore.change(id, 1);
        if (button.dataset.action === 'decrease') NomaStore.change(id, -1);
        if (button.dataset.action === 'remove') { const item = NomaStore.cart().find(entry => Number(entry.id) === id); if (item) NomaStore.change(id, -item.qty); }
        renderCart();
      });

      renderCart();
    </script>
  </body>
</html>
